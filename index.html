<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Average Speed</title>
<style>
  :root{
    --bg: #0a0c0e;
    --bg-elevated: #14171b;
    --bg-panel: #1a1e23;
    --border: #262b31;
    --text-primary: #f2f4f6;
    --text-secondary: #7c868f;
    --text-dim: #4a5158;
    --safe: #35d07f;
    --safe-dim: #1c4a33;
    --warn: #f5a623;
    --warn-dim: #4a3a15;
    --danger: #ff4d5e;
    --danger-dim: #4a1c22;
    --font-mono: ui-monospace, 'SF Mono', 'Roboto Mono', 'Cascadia Mono', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    overscroll-behavior: none;
    user-select: none;
  }

  body{
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .limit-control{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .limit-label{
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .limit-value{
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .limit-value-unit{
    font-size: 12px;
    color: var(--text-secondary);
  }

  .preset-bar{
    padding: 10px 18px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preset-caption{
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .preset-row{
    display: flex;
    gap: 8px;
  }

  .preset-btn{
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }

  .preset-btn.active{
    background: var(--safe);
    border-color: var(--safe);
    color: #06130d;
  }

  .topbar-actions{
    display: flex;
    gap: 8px;
  }

  .icon-btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 9px 12px;
    cursor: pointer;
  }

  .banner{
    text-align: center;
    padding: 16px 14px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    transition: background 0.25s ease, color 0.25s ease;
    flex-shrink: 0;
  }

  .banner.safe{ background: var(--safe-dim); color: var(--safe); }
  .banner.warn{ background: var(--warn-dim); color: var(--warn); }
  .banner.danger{
    background: var(--danger);
    color: #1a0407;
    animation: pulse 0.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.55; }
  }

  .main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px;
  }

  .dash-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-bottom: 18px;
  }

  .speed-circle{
    width: min(36vw, 158px);
    height: min(36vw, 158px);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .speed-circle.now{
    background: var(--bg-panel);
    border: 7px solid var(--border);
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  .speed-circle.now.safe{ border-color: var(--safe); }
  .speed-circle.now.warn{ border-color: var(--warn); }
  .speed-circle.now.danger{
    border-color: var(--danger);
    background: var(--danger-dim);
    animation: pulse 0.8s ease-in-out infinite;
  }

  .speed-circle.now .circle-value{
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: min(12vw, 54px);
    font-weight: 700;
    color: var(--text-primary);
    transition: color 0.2s ease;
  }

  .speed-circle.now.danger .circle-value{
    color: var(--danger);
  }

  .speed-circle.now .circle-unit{
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .speed-circle.now .circle-label{
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  .speed-circle.limit-sign{
    background: #ffffff;
    border: 10px solid #d31b23;
    box-shadow: inset 0 0 0 2px #ffffff, 0 2px 10px rgba(0,0,0,0.4);
  }

  .speed-circle.limit-sign .sign-value{
    font-family: var(--font-sans);
    font-size: min(14vw, 62px);
    font-weight: 800;
    color: #16181a;
  }

  .readout-label{
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
  }

  .readout{
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.25s ease;
  }

  .readout .value{
    font-size: min(22vw, 120px);
    font-weight: 600;
    color: var(--text-primary);
  }

  .readout.safe .value{ color: var(--safe); }
  .readout.warn .value{ color: var(--warn); }
  .readout.danger .value{ color: var(--danger); }

  .readout .unit{
    font-size: 22px;
    color: var(--text-secondary);
  }

  .limit-line{
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .stats{
    display: flex;
    justify-content: center;
    gap: 36px;
    padding: 6px 12px 18px;
    flex-shrink: 0;
  }

  .stat{
    text-align: center;
  }

  .stat .num{
    font-family: var(--font-mono);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .stat .lbl{
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .controls{
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  .session-controls{
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .session-btn{
    flex: 1;
    padding: 14px 0;
    border-radius: 14px;
    border: 1px solid var(--border);
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    background: var(--bg-panel);
    color: var(--text-primary);
  }

  .session-btn.play-btn{
    background: var(--safe);
    color: #06130d;
    border-color: var(--safe);
  }

  .session-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .session-btn:active:not(:disabled){ transform: scale(0.97); }

  .reset-btn{
    width: 100%;
    height: 76px;
    border-radius: 18px;
    border: none;
    background: var(--safe);
    color: #06130d;
    font-family: var(--font-sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .reset-btn:active{ transform: scale(0.98); }

  .reset-btn.pressed{
    animation: resetPress 0.4s ease;
  }

  @keyframes resetPress{
    0%{ transform: scale(0.95); filter: brightness(1.5); }
    100%{ transform: scale(1); filter: brightness(1); }
  }

  .gps-gate{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 30px;
  }

  .gps-gate p{
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 300px;
    line-height: 1.5;
    margin: 0;
  }

  .enable-btn{
    padding: 16px 32px;
    border-radius: 14px;
    border: none;
    background: var(--safe);
    color: #06130d;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .accuracy-note{
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding-bottom: 6px;
  }

  .hidden{ display: none !important; }

  .history-overlay{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .history-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-weight: 700;
    font-size: 16px;
  }

  .history-close{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
  }

  .history-list{
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
  }

  .history-empty{
    color: var(--text-secondary);
    font-size: 14px;
    text-align: center;
    padding: 40px 20px;
  }

  .history-item{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .history-item-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .history-date{
    font-size: 13px;
    color: var(--text-secondary);
  }

  .history-badge{
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .history-badge.ok{ background: var(--safe-dim); color: var(--safe); }
  .history-badge.over{ background: var(--danger-dim); color: var(--danger); }

  .history-item-stats{
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--text-primary);
  }

  .history-clear-btn{
    margin: 8px 18px calc(14px + env(safe-area-inset-bottom));
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--danger-dim);
    background: transparent;
    color: var(--danger);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="limit-control">
      <span class="limit-label">LIMIT</span>
      <span class="limit-value" id="limitValue">50</span>
      <span class="limit-value-unit">mph</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="voiceToggle" aria-label="Toggle voice alerts"><svg id="voiceIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <button class="icon-btn" id="historyBtn" aria-label="Trip history">History</button>
    </div>
  </div>

  <div class="preset-bar">
    <span class="preset-caption">UK LIMIT (mph)</span>
    <div class="preset-row" id="presetRow">
      <button class="preset-btn" data-mph="20">20</button>
      <button class="preset-btn" data-mph="30">30</button>
      <button class="preset-btn" data-mph="40">40</button>
      <button class="preset-btn active" data-mph="50">50</button>
      <button class="preset-btn" data-mph="60">60</button>
      <button class="preset-btn" data-mph="70">70</button>
    </div>
  </div>

  <div class="banner safe" id="banner">Waiting for GPS…</div>

  <div id="gpsGate" class="gps-gate">
    <p>This needs your location to measure distance and time between resets. It never records or shares your route — everything stays on this screen.</p>
    <button class="enable-btn" id="enableBtn">Enable GPS &amp; start</button>
  </div>

  <div id="appBody" class="hidden" style="display:contents">
    <div class="main">
      <div class="dash-row">
        <div class="speed-circle now safe" id="nowCircle">
          <div class="circle-value" id="curValue">0</div>
          <div class="circle-unit">mph</div>
          <div class="circle-label">NOW</div>
        </div>
        <div class="speed-circle limit-sign" id="limitSignCircle">
          <div class="sign-value" id="limitSignValue">50</div>
        </div>
      </div>

      <div class="readout-label">AVERAGE SPEED</div>
      <div class="readout safe" id="readout">
        <span class="value" id="avgValue">0</span>
        <span class="unit">mph</span>
      </div>
      <div class="limit-line" id="limitLine">limit 50 mph</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="distValue">0.00</div>
        <div class="lbl" id="distUnit">miles</div>
      </div>
      <div class="stat">
        <div class="num" id="timeValue">0:00</div>
        <div class="lbl">since reset</div>
      </div>
      <div class="stat">
        <div class="num" id="gpsAccuracy">–</div>
        <div class="lbl">gps accuracy (m)</div>
      </div>
    </div>

    <div class="accuracy-note" id="accuracyNote"></div>

    <div class="controls">
      <div class="session-controls">
        <button class="session-btn play-btn" id="playBtn">▶ PLAY</button>
        <button class="session-btn stop-btn" id="stopBtn">■ STOP</button>
      </div>
      <button class="reset-btn" id="resetBtn">RESET</button>
    </div>
  </div>

  <div id="historyOverlay" class="history-overlay hidden">
    <div class="history-header">
      <span>Trip History</span>
      <button class="history-close" id="historyClose">✕</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="history-clear-btn" id="historyClear">Clear history</button>
  </div>

<script>
(function(){
  var state = {
    limitMph: 50,            // always a real UK sign value: 20/30/40/50/60/70
    totalMeters: 0,
    startTime: null,
    lastFix: null,          // {lat, lon, accuracy, t} — accuracy-gated, feeds the average
    lastRawFix: null,       // {lat, lon, t} — every fix, feeds current speed
    watchId: null,
    lastBeep: 0,
    lastVoice: {},          // cooldown timestamps keyed by 'warn' / 'danger'
    voiceOn: true,
    tripWentOver: false,
    currentSpeedMps: 0,
    phase: 'idle',           // 'idle' | 'running' | 'stopped'
  };

  var els = {
    banner: document.getElementById('banner'),
    gpsGate: document.getElementById('gpsGate'),
    appBody: document.getElementById('appBody'),
    enableBtn: document.getElementById('enableBtn'),
    readout: document.getElementById('readout'),
    nowCircle: document.getElementById('nowCircle'),
    curValue: document.getElementById('curValue'),
    limitSignValue: document.getElementById('limitSignValue'),
    limitSignCircle: document.getElementById('limitSignCircle'),
    avgValue: document.getElementById('avgValue'),
    limitLine: document.getElementById('limitLine'),
    limitValue: document.getElementById('limitValue'),
    presetBtns: document.querySelectorAll('.preset-btn'),
    voiceToggle: document.getElementById('voiceToggle'),
    voiceIcon: document.getElementById('voiceIcon'),
    historyBtn: document.getElementById('historyBtn'),
    historyOverlay: document.getElementById('historyOverlay'),
    historyClose: document.getElementById('historyClose'),
    historyClear: document.getElementById('historyClear'),
    historyList: document.getElementById('historyList'),
    distValue: document.getElementById('distValue'),
    distUnit: document.getElementById('distUnit'),
    timeValue: document.getElementById('timeValue'),
    gpsAccuracy: document.getElementById('gpsAccuracy'),
    accuracyNote: document.getElementById('accuracyNote'),
    resetBtn: document.getElementById('resetBtn'),
    playBtn: document.getElementById('playBtn'),
    stopBtn: document.getElementById('stopBtn'),
  };

  var MPH_PER_MPS = 2.236936;
  var MILES_PER_METER = 0.000621371;

  function haversineMeters(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function loadHistory(){
    try{
      return JSON.parse(localStorage.getItem('specsHistory') || '[]');
    }catch(e){
      return [];
    }
  }

  function saveHistory(arr){
    try{
      localStorage.setItem('specsHistory', JSON.stringify(arr.slice(0, 50)));
    }catch(e){}
  }

  function logTrip(record){
    var h = loadHistory();
    h.unshift(record);
    saveHistory(h);
  }

  function formatTs(ts){
    var d = new Date(ts);
    return d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + ' · ' +
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderHistory(){
    var h = loadHistory();
    if(h.length === 0){
      els.historyList.innerHTML = '<div class="history-empty">No trips recorded yet.</div>';
      return;
    }
    var html = '';
    for(var i = 0; i < h.length; i++){
      var t = h[i];
      html += '<div class="history-item">' +
        '<div class="history-item-top">' +
          '<span class="history-date">' + formatTs(t.ts) + '</span>' +
          '<span class="history-badge ' + (t.wentOver ? 'over' : 'ok') + '">' + (t.wentOver ? 'OVER' : 'OK') + '</span>' +
        '</div>' +
        '<div class="history-item-stats">' + t.distanceMi.toFixed(2) + ' mi · avg ' + t.avgMph + ' mph · limit ' + t.limitMph + ' mph</div>' +
      '</div>';
    }
    els.historyList.innerHTML = html;
  }

  function updateControlButtons(){
    var running = state.phase === 'running';
    els.playBtn.disabled = running;
    els.stopBtn.disabled = !running;
  }

  function playTrip(){
    if(state.phase === 'running') return;
    state.totalMeters = 0;
    state.lastFix = null;
    state.tripWentOver = false;
    state.startTime = performance.now();
    state.phase = 'running';
    render(0, 0, 0);
    setState('safe', 'On the clock');
    updateControlButtons();
  }

  function stopTrip(){
    if(state.phase !== 'running') return;
    var elapsedSec = state.startTime != null ? (performance.now() - state.startTime) / 1000 : 0;
    var distMiles = state.totalMeters * MILES_PER_METER;
    var saved = false;
    if(elapsedSec >= 10 && distMiles >= 0.05){
      var avgMph = elapsedSec > 0 ? (state.totalMeters / elapsedSec) * MPH_PER_MPS : 0;
      logTrip({
        ts: Date.now(),
        distanceMi: Math.round(distMiles * 100) / 100,
        avgMph: Math.round(avgMph),
        limitMph: state.limitMph,
        wentOver: state.tripWentOver
      });
      saved = true;
    }
    state.phase = 'stopped';
    setState('safe', saved ? 'Trip stopped — saved to history' : 'Trip stopped — too short to save');
    updateControlButtons();
  }

  function resetCounters(){
    state.totalMeters = 0;
    state.lastFix = null;
    state.tripWentOver = false;
    if(state.phase === 'running'){
      state.startTime = performance.now();
      render(0, 0, 0);
      setState('safe', 'On the clock');
    } else {
      state.phase = 'idle';
      state.startTime = null;
      render(0, 0, 0);
      setState('safe', 'Ready — tap Play to start');
    }
    updateControlButtons();
  }

  function setState(level, msg){
    els.banner.className = 'banner ' + level;
    els.banner.textContent = msg;
    els.readout.className = 'readout ' + level;
  }

  function beepAndBuzz(){
    var now = Date.now();
    if(now - state.lastBeep < 4000) return;
    state.lastBeep = now;
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([120, 60, 120]);
  }

  function speak(text, cooldownMs, tag){
    if(!state.voiceOn) return;
    if(!('speechSynthesis' in window)) return;
    var now = Date.now();
    var last = state.lastVoice[tag] || 0;
    if(now - last < cooldownMs) return;
    state.lastVoice[tag] = now;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function limitInCurrentUnit(){
    return state.limitMph;
  }

  function renderCurrentSpeed(){
    var mps = state.currentSpeedMps || 0;
    var val = mps * MPH_PER_MPS;
    els.curValue.textContent = val.toFixed(0);
    var limitDisplay = state.limitMph;
    var ratio = limitDisplay > 0 ? val / limitDisplay : 0;
    var level = ratio >= 1 ? 'danger' : (ratio >= 0.92 ? 'warn' : 'safe');
    els.nowCircle.className = 'speed-circle now ' + level;
  }

  function render(avgSpeedMps, distMeters, elapsedSec){
    var limitDisplay = state.limitMph;
    var avgDisplay = avgSpeedMps * MPH_PER_MPS;
    var distDisplay = distMeters * MILES_PER_METER;

    els.avgValue.textContent = avgDisplay.toFixed(0);
    els.limitLine.textContent = 'limit ' + limitDisplay.toFixed(0) + ' mph';
    els.limitSignValue.textContent = limitDisplay.toFixed(0);
    els.limitValue.textContent = limitDisplay.toFixed(0);
    els.distValue.textContent = distDisplay.toFixed(2);

    var mins = Math.floor(elapsedSec / 60);
    var secs = Math.floor(elapsedSec % 60);
    els.timeValue.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;

    var ratio = limitDisplay > 0 ? avgDisplay / limitDisplay : 0;
    if(elapsedSec < 3){
      setState('safe', 'On the clock');
    } else if(ratio >= 1){
      setState('danger', '⚠ OVER AVERAGE LIMIT — EASE OFF');
      beepAndBuzz();
      speak('Over the average limit. Ease off.', 10000, 'danger');
      state.tripWentOver = true;
    } else if(ratio >= 0.92){
      setState('warn', '⚠ Close to the limit');
      speak('Approaching the average limit.', 20000, 'warn');
    } else {
      setState('safe', 'Under limit');
    }
  }

  function tick(){
    if(state.phase !== 'running' || state.startTime == null) return;
    var elapsedSec = (performance.now() - state.startTime) / 1000;
    var avgSpeed = elapsedSec > 0 ? state.totalMeters / elapsedSec : 0;
    render(avgSpeed, state.totalMeters, elapsedSec);
  }

  function onPosition(pos){
    var c = pos.coords;
    els.gpsAccuracy.textContent = c.accuracy ? c.accuracy.toFixed(0) : '–';

    if(c.accuracy && c.accuracy > 40){
      els.accuracyNote.textContent = 'Weak GPS signal — average may be less accurate right now.';
    } else {
      els.accuracyNote.textContent = '';
    }

    var now = performance.now();

    var goodFix = c.accuracy && c.accuracy <= 20;
    var instSpeedMps = (goodFix && typeof c.speed === 'number' && c.speed >= 0 && isFinite(c.speed)) ? c.speed : null;

    if(instSpeedMps === null && goodFix && state.lastRawFix){
      var dtRaw = (now - state.lastRawFix.t) / 1000;
      if(dtRaw > 0.25){
        var dRaw = haversineMeters(state.lastRawFix.lat, state.lastRawFix.lon, c.latitude, c.longitude);
        var derived = dRaw / dtRaw;
        if(derived <= 112){
          instSpeedMps = derived;
        }
      }
    }
    state.lastRawFix = { lat: c.latitude, lon: c.longitude, t: now };

    if(instSpeedMps !== null){
      if(instSpeedMps < 0.9){
        instSpeedMps = 0;
      }
      var prevSpeed = state.currentSpeedMps || 0;
      if(Math.abs(instSpeedMps - prevSpeed) <= 13){
        state.currentSpeedMps = prevSpeed * 0.35 + instSpeedMps * 0.65;
        renderCurrentSpeed();
      }
    }

    if(state.phase === 'running' && state.lastFix && c.accuracy && c.accuracy <= 40){
      var d = haversineMeters(state.lastFix.lat, state.lastFix.lon, c.latitude, c.longitude);
      if(d > 1.5){
        state.totalMeters += d;
      }
    }
    if(state.phase === 'running' && (!c.accuracy || c.accuracy <= 40)){
      state.lastFix = { lat: c.latitude, lon: c.longitude, t: now };
    }
    tick();
  }

  function onPositionError(err){
    setState('warn', 'GPS signal lost — ' + (err.message || 'retrying'));
  }

  function startGps(){
    if(!navigator.geolocation){
      setState('danger', 'GPS not available on this device/browser');
      return;
    }
    els.gpsGate.classList.add('hidden');
    els.appBody.classList.remove('hidden');
    state.phase = 'running';
    state.totalMeters = 0;
    state.startTime = performance.now();
    state.tripWentOver = false;
    render(0, 0, 0);
    setState('safe', 'On the clock');
    updateControlButtons();
    state.watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    });
    setInterval(tick, 1000);
  }

  els.enableBtn.addEventListener('click', startGps);
  els.resetBtn.addEventListener('click', function(){
    resetCounters();
    els.resetBtn.classList.remove('pressed');
    void els.resetBtn.offsetWidth; // restart animation if tapped again quickly
    els.resetBtn.classList.add('pressed');
    if(navigator.vibrate) navigator.vibrate(40);
  });
  els.playBtn.addEventListener('click', function(){
    playTrip();
    if(navigator.vibrate) navigator.vibrate(30);
  });
  els.stopBtn.addEventListener('click', function(){
    stopTrip();
    if(navigator.vibrate) navigator.vibrate(30);
  });

  els.presetBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      state.limitMph = parseInt(btn.getAttribute('data-mph'), 10);
      els.presetBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      tick();
      renderCurrentSpeed();
    });
  });

  var VOICE_ICON_ON = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>';
  var VOICE_ICON_OFF = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6" opacity="0.35"/><path d="M18.5 6.5a8 8 0 0 1 0 11" opacity="0.35"/><line x1="2.5" y1="2.5" x2="21.5" y2="21.5"/>';

  els.voiceToggle.addEventListener('click', function(){
    state.voiceOn = !state.voiceOn;
    els.voiceIcon.innerHTML = state.voiceOn ? VOICE_ICON_ON : VOICE_ICON_OFF;
    if(!state.voiceOn && 'speechSynthesis' in window){
      window.speechSynthesis.cancel();
    }
  });

  els.historyBtn.addEventListener('click', function(){
    renderHistory();
    els.historyOverlay.classList.remove('hidden');
  });
  els.historyClose.addEventListener('click', function(){
    els.historyOverlay.classList.add('hidden');
  });
  els.historyClear.addEventListener('click', function(){
    saveHistory([]);
    renderHistory();
  });
})();
</script>
</body>
</html>
